name: Send test post

# Run by hand from the Actions tab. Posts the newest story once, whether
# or not it has been posted before. It goes to the webhook channel if a
# webhook is set, and otherwise to every server the bot is set up in.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Post the newest story
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME }}
        run: python3 poster.py --test
