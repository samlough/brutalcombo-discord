name: Post new stories

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never run two checks at once, so a story can't be posted twice.
concurrency:
  group: poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check the feed and post new stories
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME }}
          SKIP_CATEGORIES: ${{ vars.SKIP_CATEGORIES }}
        run: python3 poster.py --once

      # Runs even if the step above failed part way, so stories that
      # were already posted are remembered.
      - name: Save what has been posted and which servers are set up
        if: always()
        run: |
          for f in seen.json servers.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update posted stories"
          git push
